name: Web Build CI

on:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  web-build:
    name: Build Web
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Web-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-Web-
            Library-

      # develop
      - name: Build Web Development
        if: github.ref == 'refs/heads/develop'
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.3.18f1
          targetPlatform: WebGL
          buildMethod: WebBuildTool.BuildDevelopment

      - name: Upload Web Development artifact
        if: github.ref == 'refs/heads/develop'
        uses: actions/upload-artifact@v4
        with:
          name: planetary-journey-web-develop
          path: Builds/Web/Development
          if-no-files-found: error

      # main
      - name: Build Web Release
        if: github.ref == 'refs/heads/main'
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.3.18f1
          targetPlatform: WebGL
          buildMethod: WebBuildTool.BuildRelease

      - name: Upload Web Release artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: planetary-journey-web-release
          path: Builds/Web/Release
          if-no-files-found: error
